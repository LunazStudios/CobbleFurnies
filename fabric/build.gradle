plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "earth.terrarium.athena:athena-fabric-${minecraft_version}:${athena_version}"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_api_fabric}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_fabric}"

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive false }
    runtimeOnly("net.mezzdev.config:mezz_config-${minecraft_version}-fabric:${mezz_config_version}") { transitive false }


    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    archiveClassifier = ''
    archiveBaseName.set("${rootProject.archives_name}-Fabric-${rootProject.minecraft_version}")
    destinationDirectory.set(rootProject.file("builds/fabric"))
}

assemble.dependsOn shadowJar
