plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven{
        url = "https://maven.resourcefulbees.com/repository/maven-public/"
        content { includeGroup("earth.terrarium.athena") }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup("mezz.jei")
            includeGroup("net.mezzdev.config")
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup("mezz.jei")
            includeGroup("net.mezzdev.config")
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "earth.terrarium.athena:athena-neoforge-1.21.1:${athena_version}"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    if (!providers.gradleProperty("withoutCobblemon").isPresent()) {
        modImplementation "com.cobblemon:neoforge:${project.cobblemon_version}"
    }

    modImplementation "thedarkcolour:kotlinforforge-neoforge:${project.kotlin_for_forge_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.kotlin_runtime_version"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootProject.kotlin_runtime_version"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootProject.kotlin_runtime_version"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:$rootProject.kotlin_runtime_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    archiveBaseName.set("${rootProject.archives_name}-NeoForge-${rootProject.minecraft_version}")
    destinationDirectory.set(rootProject.file("builds/neoforge"))
}

apply from: rootProject.file('gradle/client-runs.gradle')
