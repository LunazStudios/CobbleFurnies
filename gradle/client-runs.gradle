if (providers.gradleProperty('withoutCobblemon').isPresent()) {
    def standaloneDirectory = 'run/without-cobblemon'
    loom.runs.client.runDir = standaloneDirectory

    loom.settingsPostEdit.add({ run ->
        if (run.environment == 'client' && run.runDir == standaloneDirectory) {
            run.mainClass = 'net.fabricmc.devlaunchinjector.Main'
            run.vmArgs.removeAll { arg ->
                arg.startsWith('-Darchitectury.main.class=') ||
                        arg.startsWith('-Darchitectury.runtime.transformer=') ||
                        arg.startsWith('-Darchitectury.properties=') ||
                        (arg.startsWith('-javaagent:') && arg.contains('architectury-transformer-agent'))
            }
            run.environmentVariables.remove('MOD_CLASSES')
        }
    } as java.util.function.Consumer)

    def prepareStandaloneClient = tasks.register('prepareStandaloneClient', Copy) {
        from(tasks.named('shadowJar').flatMap { it.archiveFile })
        into(layout.projectDirectory.dir("${standaloneDirectory}/mods"))
        rename { 'CobbleFurnies-dev.jar' }
    }

    tasks.named('runClient').configure {
        dependsOn prepareStandaloneClient
        classpath = sourceSets.main.runtimeClasspath - sourceSets.main.output - configurations.common
    }
}
